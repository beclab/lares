# Lares overlay on dsh-base + dsh-web-app.
# Applied after those bundles; id patches replace whole config (restate kept keys).

- id: system-prompt
  config:
    includeHarnessIdentity: false
    persona: !!js process.env.DSH_SYSTEM_PROMPT ?? ''

# Drop dsh-web-app's DeepSeek Harness GUI / checkout prompt; lares-brand owns the surface.
- id: web-runtime
  config:
    printUrl: true
    surfaceContext: false
    trustedHosts: !!js ctx.webStartup.trustedHosts

# CLI rejects --host 0.0.0.0; Olares probes/mesh need all-interfaces bind.
# Keep inject from dsh-web-app; this patch only replaces config.
- id: webserver
  config:
    host: '0.0.0.0'
    port: !!js Number(process.env.PORT ?? 8080)

- id: fs-sandbox
  config:
    cwd: !!js process.env.DSH_CWD ?? process.env.LARES_WORKSPACE ?? process.cwd()

# The Router route is an llm-pi-ai profile boot seeds into the user's settings
# document (see server/olares/bootstrap-settings.ts), which is also where the
# Models page edits it. The DeepSeek adapter would only put a provider Lares
# cannot reach in the picker; users who want it add it through "Add provider".
- id: llm-deepseek
  disabled: true

# Official Models page: provider routes, endpoints, and API keys are Router's
# business on Olares, so the only choice it leaves a user is which model new
# sessions start from — that is what @lares/chat-model renders instead. Disabled
# rather than shadowed: the Settings nav is built from the raw slot ledger, so a
# same-id entry would only duplicate the nav row. Its `settings.onboarding`
# steps (DeepSeek internal-testing notice, official-provider dialog) go with it.
- id: ui-settings-models
  disabled: true

# Replace DeepSeek-native search with Lares's multi-provider facade (`lares`).
- id: web-search-deepseek
  disabled: true

- id: web
  config:
    searchProvider: lares

# Read-only Loader dump: not actionable on Olares, and the Web host already
# parks most tool rows as disabled until a session preset mounts them.
- id: plugin-inventory
  disabled: true

- id: ui-settings-plugin-inventory
  disabled: true

# Agent-preset switcher (hero chip, session header, Settings). Sessions still
# mount the deployment default from `agent-presets` (standard); re-enable when
# mode switching is a product surface again.
- id: ui-agent-preset
  disabled: true

# Community right sidebar (dsh-better-sidebar). Kept installed on the profile;
# flip disabled off when we want the workbench again.
- id: better-sidebar
  disabled: true

- id: agent-default-model
  config:
    provider: olares-router
    model: !!js process.env.DSH_MODEL ?? 'default'

- id: sandbox-policy
  config:
    mode: !!js process.env.DSH_PERMISSION_MODE ?? process.env.LARES_PERMISSION_MODE ?? 'workspace-write'
    workspaceRoot: !!js process.env.DSH_CWD ?? process.env.LARES_WORKSPACE ?? process.cwd()

- id: approval
  config:
    policy: !!js "(process.env.DSH_PERMISSION_MODE ?? process.env.LARES_PERMISSION_MODE ?? 'workspace-write') === 'danger-full-access' ? 'never' : 'ask'"

# Preset `name` / `description` reach the composer chip, its tooltip and the
# Settings row verbatim — the wire carries no locale, so localized copy here
# would stay Chinese under an English UI. Keep the kebab keys dsh's display
# transform title-cases (`workspace-write` → Workspace Write,
# `danger-full-access` → Full access) and leave the surrounding copy to the
# client dictionaries.
- id: permission
  config:
    defaultPreset: !!js process.env.DSH_PERMISSION_MODE ?? process.env.LARES_PERMISSION_MODE ?? 'workspace-write'
    presets:
      read-only:
        sandbox: read-only
        approval: ask
        name: read-only
        description: Read files only; writes and risky commands require approval.
      workspace-write:
        sandbox: workspace-write
        approval: ask
        name: workspace-write
        description: Write inside the workspace; anything wider requires approval.
      danger-full-access:
        sandbox: danger-full-access
        approval: never
        name: danger-full-access
        description: No file sandbox and no approval prompts.

- insert:
    - id: lares-llm-routes
      name: '@lares/dsh-overlay/host/llm-routes.js'
      inject: [webServer]

    - id: lares-crypto-uuid
      name: '@lares/dsh-overlay/host/crypto-uuid.js'
      inject: [webServer]

    - id: lares-olares-identity
      name: '@lares/dsh-overlay/host/olares/olares-identity.js'
      inject: [webServer]

    - id: lares-default-workspace
      name: '@lares/dsh-overlay/host/default-workspace.js'
      inject: [workspaceRegistry]

    - id: lares-brand
      name: '@lares/brand'
      inject: [webServer]

    - id: lares-composer-voice
      name: '@lares/composer-voice'
      inject: [webServer]

    - id: lares-composer-attach
      name: '@lares/composer-attach'
      inject: [webServer, workspaceRegistry, sessionPersistence]

    - id: lares-workspace-preview
      name: '@lares/workspace-preview'
      inject: [webServer, workspaceRegistry, sessionPersistence]

    - id: lares-workspace-artifacts
      name: '@lares/workspace-artifacts'
      inject: [tools, systemPrompt]

    - id: lares-router-search
      name: '@lares/router-search'
      inject: [web, webServer]

    - id: lares-chat-model
      name: '@lares/chat-model'
      inject: [webServer, llm, agentDefaultModel, settings]
