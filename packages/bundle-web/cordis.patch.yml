# Dina overlay on dsh-base + dsh-web-app.
# Applied after those bundles; id patches replace whole config (restate kept keys).

- id: system-prompt
  config:
    persona: !!js process.env.DSH_SYSTEM_PROMPT ?? 'You are Dina, a helpful assistant running on Olares. Prefer olares-cli for Olares platform tasks when skills apply.'

# CLI rejects --host 0.0.0.0; Olares probes/mesh need all-interfaces bind.
# Keep inject from dsh-web-app; this patch only replaces config.
- id: webserver
  config:
    host: '0.0.0.0'
    port: !!js Number(process.env.PORT ?? 8080)

- id: fs-sandbox
  config:
    cwd: !!js process.env.DSH_CWD ?? process.env.DINA_WORKSPACE ?? process.cwd()

# Provider stays deepseek-official (wire dialect matches Router); model ids come from Router catalog.
- id: llm-deepseek
  config:
    apiKeyEnv: DEEPSEEK_API_KEY
    thinking: enabled
    reasoningEffort: !!js process.env.DINA_REASONING_EFFORT ?? 'max'
    models: !!js JSON.parse(process.env.DINA_ROUTER_MODELS_JSON || '[{"id":"default","name":"Default","contextWindow":128000}]')

- id: agent-default-model
  config:
    provider: deepseek-official
    model: !!js process.env.DSH_MODEL ?? process.env.DINA_DEFAULT_MODEL ?? 'default'

- id: sandbox-policy
  config:
    mode: !!js process.env.DSH_PERMISSION_MODE ?? process.env.DINA_PERMISSION_MODE ?? 'workspace-write'
    workspaceRoot: !!js process.env.DSH_CWD ?? process.env.DINA_WORKSPACE ?? process.cwd()

- id: approval
  config:
    policy: !!js "(process.env.DSH_PERMISSION_MODE ?? process.env.DINA_PERMISSION_MODE ?? 'workspace-write') === 'danger-full-access' ? 'never' : 'ask'"

- id: permission
  config:
    defaultPreset: !!js process.env.DSH_PERMISSION_MODE ?? process.env.DINA_PERMISSION_MODE ?? 'workspace-write'
    presets:
      read-only:
        sandbox: read-only
        approval: ask
        name: 只读
        description: 只能读文件；写操作与危险命令需审批
      workspace-write:
        sandbox: workspace-write
        approval: ask
        name: 工作区可写
        description: 可改工作区内文件；越权操作需审批
      danger-full-access:
        sandbox: danger-full-access
        approval: never
        name: 完全访问
        description: 不限制文件沙箱，也不再弹出审批

- insert:
    - id: dina-llm-routes
      name: '@dina/bundle-web/host/llm-routes.js'
      inject: [webServer]

    - id: dina-olares-identity
      name: '@dina/bundle-web/host/olares/olares-identity.js'
      inject: [webServer]

    - id: dina-client-brand
      name: '@dina/client-dina'
