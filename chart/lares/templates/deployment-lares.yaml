apiVersion: apps/v1
kind: Deployment
metadata:
  name: lares
  namespace: '{{ .Release.Namespace }}'
  labels:
    io.kompose.service: lares
spec:
  replicas: {{ .Values.workloads.lares.replicaCount }}
  selector:
    matchLabels:
      io.kompose.service: lares
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: lares
    spec:
      containers:
      - name: lares
        image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        env:
        - name: LLM_GATEWAY_URL
          value: {{ .Values.gateway.url | quote }}
        # The gateway lazily registers whatever app name it sees, so this value
        # is the app's identity in the LLM Gateway console and usage reports.
        - name: OLARES_APP_ID
          value: lares
        - name: LARES_GATEWAY_API_KEY
          value: {{ .Values.gateway.apiKey | quote }}
        - name: PI_DEFAULT_MODEL
          value: {{ .Values.defaultModel | quote }}
        ports:
        - containerPort: 30141
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /api/health
            port: 30141
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/health
            port: 30141
          initialDelaySeconds: 30
          periodSeconds: 30
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 2000m
            memory: 4Gi
        volumeMounts:
        - name: lares-data
          mountPath: /data
      restartPolicy: Always
      volumes:
      - name: lares-data
        hostPath:
          path: {{ .Values.userspace.appData }}/lares
          type: DirectoryOrCreate
