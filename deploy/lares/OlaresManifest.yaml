apiVersion: v3
olaresManifest.version: '0.12.0'
olaresManifest.type: app
metadata:
  name: lares
  appid: lares
  title: Lares
  description: Chat on Olares, wired to Router
  icon: https://app.cdn.olares.com/appstore/lares/icon_new.png
  version: 0.26.85
  categories:
    - agents
  tags:
    - framework
    - personal-assistant
spec:
  versionName: "0.26.85"
  runAsUser: true
  fullDescription: |
    Lares is a chat app on Olares.
    It talks to Olares Router for LLM access.

    **Highlights**
    - Three-column chat UI with the Lares product profile
    - Zero-config Router auth via in-cluster app identity (`x-caller-appid`)
    - Bundled client plugins (voice input, web search) when enabled in the build
    - Optional Docker-in-Docker sidecar (`ENABLE_DIND`, default on) so the agent can run `docker` against a pod-local daemon

    **Requirements**
    - Olares >= 1.12.7
    - Router app installed and running (`router` dependency)
    - Arch: amd64, arm64

    **Getting started**
    1. Install Lares from Market (test source: `market.test`).
    2. Ensure Router is installed.
    3. Open the Lares entrance and start a chat.
  upgradeDescription: |
    Home Assistant skills download and turn on from Settings. The download installs the command-line tool, exports the skills, and enables the pack. The server address and long-lived token are saved on that page.

    - A tool call that only appeared in the reasoning runs in the same turn.
    - Voice input starts on a fresh install.
    - Automation tasks run a prompt on a schedule, and topic morning briefs are written to the workspace.
    - Devices such as Reachy Mini can use their own tools in voice conversations through a voice key that allows device tools.
    - Router reaches Lares voice through an internal entrance; the Lares page address gains a trailing 0.
    - Voice devices without playback reports no longer hear their own replies as new turns, and replies are no longer queued behind history summaries.
    - Automatic turn detection ends a turn in a noisy room instead of waiting until the audio limit.
    - Voice devices that stream their microphone skip turns in which Router's voice detection hears no speech.
    - Voice devices hand home control, lookups and schedules to Lares and answer in the user's language.
    - A voice conversation keeps working after a delegated task finishes on chat models that require the system prompt first.
    - Voice replies run without model reasoning, so they start in under a second, and devices perform gestures instead of describing them.
    - Voice devices answer in the language just spoken, acknowledge a request before the Agent starts, ignore filler noise, and announce results without waiting on room noise.
    - Voice devices can be interrupted mid-reply and keep their answers to one short sentence; Lares's own push-to-talk clients are unchanged.
    - Voice sessions wait briefly when speech recognition is busy instead of failing, and voice devices learn a loud room's level so they stop recording endless takes.
    - Voice devices in a room with a fan or a motor stop recording it as one endless take.
    - Voice devices hear their room with a speech model instead of by loudness, no longer interrupt themselves with their own voice, and keep answers after a camera look to one sentence.
    - Voice devices stop listening once the speaker's words end, even with other people talking nearby, and acknowledge a task in a few words.
    - A cough or a knock near a voice device no longer keeps it listening for ten seconds.
    - Home Assistant skills use hass-cli 0.0.2, which turns a light on in a couple of steps; installs that already have the skills are upgraded at startup. A cough no longer holds a hands-free headset take open either.
    - Voice devices no longer drop a spoken command as background noise when it is quieter than its first syllable.
    - Voice devices start speaking from the speech engine's first audio, acknowledge a task faster, and the Agent turns a light on in fewer steps with hass-cli 0.0.3.
    - Voice devices can start speaking a reply while it is still being written, when read-while-writing is on and the GPU is memory-sliced.
    - Voice devices hand a light or other home device request to Lares even after an earlier reply only said it was being done, and when the user says it still has not happened.

    [Release notes](https://github.com/beclab/lares/releases/tag/v0.26.85)
  developer: luolong
  submitter: Olares
  locale:
    - en-US
    - zh-CN
    - fr-FR
    - de-DE
    - ja-JP
    - it-IT
    - es-ES
  requiredCpu: 400m
  limitedCpu: "6"
  requiredMemory: 768Mi
  limitedMemory: 12Gi
  requiredDisk: 2Gi
  limitedDisk: 50Gi
  supportArch:
    - amd64
    - arm64
permission:
  appData: true
  loginOlaresCLI: true
  # Files shared with FlowStudio: Lares writes the user's input media to
  # Home/FlowStudio/uploads, FlowStudio reads them there and writes outputs
  # beside them in Home/FlowStudio/outputs.
  userData:
    - Home/FlowStudio
entrances:
  - name: lares
    host: lares-svc
    port: 8080
    title: Lares
    icon: https://app.cdn.olares.com/appstore/lares/icon_new.png
    authLevel: private
    openMethod: window
  # Public call entrance. Commented out while only the in-cluster entrance is used.
  # - name: webhook
  #   host: lares-svc
  #   port: 8081
  #   title: Webhook
  #   authLevel: public
  #   invisible: true
  # Router and other in-cluster callers. Olares publishes sharedEntrances only for
  # shared and cluster-scoped apps, so on a per-user app the webhook has to be an
  # app entrance; internal lets in-cluster callers in without a login. A second
  # entrance moves the page to <appid>0 and this one to <appid>1.
  - name: webhook-internal
    host: lares-svc
    port: 8081
    title: Webhook
    authLevel: internal
    invisible: true
options:
  apiTimeout: 0
  # Brand mark + PWA manifest public so the browser-tab favicon loads before the
  # private-entrance auth redirect (same pattern Ashia uses for its icon assets).
  policies:
    - entranceName: lares
      description: Brand mark and PWA manifest
      uriRegex: ^/lares/(mark\.svg|manifest\.webmanifest)$
      level: public
  dependencies:
    - name: olares
      version: '>=1.12.7-0'
      type: system
    - name: router
      version: '>=1.0.0'
      type: application
workloadReplicas:
  lares: 1
envs:
  - envName: TIMEZONE
    required: true
    applyOnChange: true
    valueFrom:
      envName: OLARES_USER_TIMEZONE
    description: "Time zone used by Lares, its agents, and commands (IANA name such as Asia/Shanghai)"
  - envName: ENABLE_DIND
    type: bool
    required: false
    applyOnChange: true
    editable: true
    default: "true"
    description: "Run a privileged Docker-in-Docker sidecar in the pod. Exposes the docker CLI via DOCKER_HOST=tcp://localhost:2375 (uses extra CPU/RAM/disk under app data). Disable if your environment forbids privileged containers"
