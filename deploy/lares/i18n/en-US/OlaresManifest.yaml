metadata:
  title: Lares
  description: Chat on Olares, wired to Router

spec:
  fullDescription: |
    ## Overview
    Lares is a chat app on Olares.
    It talks to Olares Router for LLM access.

    ## Highlights
    - Three-column chat UI with the Lares product profile
    - Zero-config Router auth via in-cluster app identity (`x-caller-appid`)
    - Bundled client plugins (voice input, web search) when enabled in the build
    - Optional Docker-in-Docker sidecar (`ENABLE_DIND`, default on) so the agent can run `docker` against a pod-local daemon

    ## Requirements
    - Olares >= 1.12.7
    - Router app installed and running (`router` dependency)
    - Arch: amd64, arm64

    ## Getting started
    1. Install Lares from Market (test source: `market.test`).
    2. Ensure Router is installed.
    3. Open the Lares entrance and start a chat.
  upgradeDescription: |
    ## Lares 0.26.23

    - olares-cli keeps working across a whole conversation. The agent sandbox
      blocks writes outside the session workspace, so the credential Olares
      mounts for this app used to be lost after every command and the next one
      reported that no profile was configured.
    - The agent is told the CLI is already signed in as you, and that a login
      is neither needed nor possible. It used to be told an entrance login set
      that up, and would go looking for one when a command failed.
