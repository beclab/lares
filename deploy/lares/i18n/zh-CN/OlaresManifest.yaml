metadata:
  title: Lares
  description: 运行在 Olares 上的聊天应用，对接 Router

spec:
  fullDescription: |
    ## 概述
    Lares 是运行在 Olares 上的聊天应用。
    通过 Olares Router 访问 LLM。

    ## 能力
    - 三栏聊天界面 + Lares 产品品牌
    - 通过集群内应用身份（`x-caller-appid`）零配置对接 Router
    - 构建启用时内置客户端插件（语音输入、网页搜索）
    - 可选 Docker-in-Docker sidecar（`ENABLE_DIND`，默认开启），Agent 可在 Pod 内使用 `docker`

    ## 运行要求
    - Olares >= 1.12.7
    - 已安装并运行 Router 应用（`router` 依赖）
    - 架构：amd64、arm64

    ## 开始使用
    1. 从 Market 安装 Lares（测试源：`market.test`）。
    2. 确认 Router 已安装。
    3. 打开 Lares 入口开始对话。
  upgradeDescription: |
    ## Lares 0.26.22

    - Files 预览改为从父目录 listing 取 stat，再用 GET raw `inline=true` 取内容。
      HEAD `/api/raw` 不是 Files 接口，Drive 打开会在出图前 404。
    - 工作区和 Files 的可播放媒体共用末尾预览区。回复末尾再写路径芯片或行内代码，
      会和预览重复，现已隐藏。
    - 发布 Files 目录（`drive/.../`）按 Files 路径拒绝，不再当成工作区缺文件。
