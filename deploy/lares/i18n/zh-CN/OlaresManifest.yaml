metadata:
  title: Lares
  description: 运行在 Olares 上的聊天应用，对接 Router

spec:
  fullDescription: |
    ## 概述
    Lares 是运行在 Olares 上的聊天应用。
    通过 Olares Router 访问 LLM。

    ## 能力
    - 三栏聊天界面 + Lares 产品品牌
    - 通过集群内应用身份（`x-caller-appid`）零配置对接 Router
    - 构建启用时内置客户端插件（语音输入、网页搜索）
    - 可选 Docker-in-Docker sidecar（`ENABLE_DIND`，默认开启），Agent 可在 Pod 内使用 `docker`

    ## 运行要求
    - Olares >= 1.12.7
    - 已安装并运行 Router 应用（`router` 依赖）
    - 架构：amd64、arm64

    ## 开始使用
    1. 从 Market 安装 Lares（测试源：`market.test`）。
    2. 确认 Router 已安装。
    3. 打开 Lares 入口开始对话。
  upgradeDescription: |
    ## Lares 0.26.23

    - olares-cli 在整段对话里都可用。智能体沙箱不允许写会话工作区以外的目录，
      因此 Olares 为本应用挂载的凭证以前每执行一条命令就丢一次，下一条命令会
      报「没有配置 profile」。
    - 智能体现在知道 CLI 已经以你的身份登录，既不需要也无法再登录一次。之前它
      被告知入口登录会准备好这些，命令一失败就会去找那个登录。
