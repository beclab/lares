metadata:
  title: Lares
  description: 运行在 Olares 上的聊天应用，对接 Router

spec:
  fullDescription: |
    Lares 是运行在 Olares 上的聊天应用。
    通过 Olares Router 访问 LLM。

    **能力**
    - 三栏聊天界面 + Lares 产品品牌
    - 通过集群内应用身份（`x-caller-appid`）零配置对接 Router
    - 构建启用时内置客户端插件（语音输入、网页搜索）
    - 可选 Docker-in-Docker sidecar（`ENABLE_DIND`，默认开启），Agent 可在 Pod 内使用 `docker`

    **运行要求**
    - Olares >= 1.12.7
    - 已安装并运行 Router 应用（`router` 依赖）
    - 架构：amd64、arm64

    **开始使用**
    1. 从 Market 安装 Lares（测试源：`market.test`）。
    2. 确认 Router 已安装。
    3. 打开 Lares 入口开始对话。
  upgradeDescription: |
    设置里可以下载并启用 Home Assistant 技能。下载会安装命令行、导出技能并启用该包。同一页保存服务器地址和长期访问令牌。

    - 只出现在思考过程里的工具调用，会在同一轮真正执行。
    - 全新安装后语音输入可以启动。
    - 自动化任务可以按时间执行指令，分主题的晨报会写入工作区。
    - 勾选“允许设备工具”的语音密钥可以让 Reachy Mini 等设备在语音对话中使用自己的工具。
    - Router 通过内部入口访问 Lares 语音；Lares 页面地址的第一段末尾多了一个 0。
    - 不回报播放进度的语音设备不再把自己的回复声音当成新的一轮，回复也不再排在历史摘要后面。
    - 自动断句在有噪音的房间里也能结束一轮，不再一直等到录音时长上限。
    - 持续上传麦克风的语音设备，如果 Router 的人声检测没听到人声，这一轮会被跳过。
    - 语音设备会把家居控制、查询和日程交给 Lares 处理，并用用户说话的语言回复。
    - 对话模型要求系统提示必须放在最前面时，委派任务完成后语音对话也能继续。
    - 语音回复不再让模型先思考，一秒内就能开口；设备会真的做动作，而不是只用嘴说。
    - 语音设备按用户刚说的语言回答；先应答再让 Agent 开工；不理会“嗯、啊”这类噪音；房间有噪音时也能及时播报结果。
    - 语音设备说话时可以被打断，回答也压缩成一句短话；Lares 自己按住说话的客户端不受影响。
    - 语音识别繁忙时会稍等重试而不是直接报错；语音设备会学习嘈杂房间的音量，不再没完没了地录音。
    - 语音设备在有风扇或电机噪音的房间里，不会再把噪音当成一段录不完的语音。
    - 语音设备改用语音模型（而不是音量）判断有没有人说话，不再被自己的声音打断，看完摄像头后的回答也只说一句。
    - 语音设备在说话人说完后就结束录音，即使旁边有人在聊天；接到任务时也只简短应答。
    - 语音设备旁边的一声咳嗽或敲击，不会再让它白白录音十秒。
    - Home Assistant 技能改用 hass-cli 0.0.2，开灯只需几步；已安装的技能会在启动时自动升级。耳机免提模式下，一声咳嗽也不会再让录音一直开着。
    - 语音设备不会再把音量比第一个字小的指令当成噪音丢掉。
    - 语音设备从语音合成的第一段音频就开始说话，接任务的应答更快；Agent 借助 hass-cli 0.0.3 用更少的步骤开灯。

    [版本说明](https://github.com/beclab/lares/releases/tag/v0.26.83)
