metadata:
  title: Lares
  description: Un asistente de IA para gestionar Olares e investigar en la web

spec:
  fullDescription: |
    Lares es el asistente de IA oficial de Olares. Describe un objetivo en lenguaje natural para gestionar aplicaciones, archivos y el sistema. Con Router y un modelo de IA conectado, Lares planifica los pasos y utiliza herramientas para realizar tareas en tu dispositivo mediante la conversación.

    **Funciones principales**

    - Gestiona solicitudes cotidianas y tareas que requieren varios pasos en una misma conversación.
    - Utiliza los modelos de IA y las herramientas configurados en Router.
    - Controla lo que Lares puede hacer con los permisos de Solo lectura, Escritura o Acceso completo.
    - Investiga contenido público de la web con las herramientas de búsqueda y lectura de páginas configuradas y obtén resúmenes con enlaces a las fuentes.

    **Antes de empezar**

    Lares requiere Olares 1.12.7 o posterior, Router y un modelo de IA conectado. Selecciona un modelo y confirma el nivel de permisos antes de iniciar una tarea.

    Para investigar en la web, configura y habilita las herramientas en Router. Para utilizar la búsqueda web, selecciona también un servicio de búsqueda predeterminado en los ajustes de Lares. Las herramientas que solo leen páginas web se utilizan cuando pides a Lares que lea una URL concreta.
  upgradeDescription: |
    Las skills de Home Assistant se descargan y se activan en los ajustes. La descarga instala la herramienta de línea de comandos, exporta las skills y activa el paquete. La dirección del servidor y el token de larga duración se guardan en la misma página.

    - Una llamada de herramienta que solo aparecía en el razonamiento se ejecuta en el mismo turno.
    - La entrada de voz arranca tras una instalación nueva.
    - Las tareas automáticas ejecutan una instrucción según un horario, y los resúmenes matutinos por tema se guardan en el espacio de trabajo.
    - Dispositivos como Reachy Mini pueden usar sus propias herramientas en conversaciones de voz con una clave de voz que permite herramientas del dispositivo.
    - Router llega a la voz de Lares por una entrada interna; la dirección de la página de Lares ahora termina en 0 en su primera parte.
    - Los dispositivos de voz que no informan de la reproducción ya no oyen sus propias respuestas como un turno nuevo, y las respuestas ya no esperan a los resúmenes del historial.
    - La detección automática de turnos cierra un turno en una sala ruidosa en lugar de esperar al límite de audio.
    - Los dispositivos de voz que envían su micrófono sin parar omiten los turnos en los que la detección de voz de Router no oye habla.
    - Los dispositivos de voz pasan a Lares el control del hogar, las consultas y la agenda, y responden en el idioma del usuario.
    - Una conversación de voz sigue tras terminar una tarea delegada, también con modelos que exigen el prompt de sistema al principio.

    [Notas de la versión](https://github.com/beclab/lares/releases/tag/v0.26.71)
