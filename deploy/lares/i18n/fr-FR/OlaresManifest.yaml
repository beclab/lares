metadata:
  title: Lares
  description: Un assistant IA pour gérer Olares et effectuer des recherches sur le web

spec:
  fullDescription: |
    Lares est l’assistant IA officiel d’Olares. Décrivez un objectif en langage naturel pour gérer vos applications, vos fichiers et votre système. Avec Router et un modèle d’IA connecté, Lares planifie les étapes et utilise des outils pour effectuer des tâches sur votre appareil au fil de la conversation.

    **Fonctionnalités principales**

    - Traitez les demandes quotidiennes et les tâches en plusieurs étapes dans une même conversation.
    - Utilisez les modèles d’IA et les outils configurés dans Router.
    - Contrôlez les actions de Lares avec les autorisations Lecture seule, Écriture ou Accès complet.
    - Explorez le contenu public du web avec les outils de recherche et de lecture de pages configurés, puis obtenez des synthèses avec des liens vers les sources.

    **Avant de commencer**

    Lares nécessite Olares 1.12.7 ou une version ultérieure, Router et un modèle d’IA connecté. Sélectionnez un modèle et confirmez le niveau d’autorisation avant de lancer une tâche.

    Pour effectuer des recherches sur le web, configurez et activez les outils dans Router. Pour utiliser la recherche web, sélectionnez également un service de recherche par défaut dans les paramètres de Lares. Les outils qui servent uniquement à lire des pages web sont appelés lorsque vous demandez à Lares de lire une URL précise.
  upgradeDescription: |
    Les skills Home Assistant se téléchargent et s’activent dans les réglages. Le téléchargement installe l’outil en ligne de commande, exporte les skills et active le paquet. L’adresse du serveur et le jeton de longue durée s’enregistrent sur la même page.

    - Un appel d’outil qui n’apparaissait que dans le raisonnement s’exécute dans le même tour.
    - La saisie vocale démarre après une installation neuve.
    - Les tâches automatisées exécutent une consigne selon un horaire, et les bulletins du matin par thème sont enregistrés dans l’espace de travail.
    - Des appareils comme Reachy Mini peuvent utiliser leurs propres outils en conversation vocale avec une clé vocale qui autorise les outils d'appareil.
    - Router atteint la voix de Lares par une entrée interne ; l'adresse de la page Lares se termine désormais par 0 dans sa première partie.
    - Les appareils vocaux qui ne signalent pas la lecture n'entendent plus leurs propres réponses comme un nouveau tour, et les réponses n'attendent plus les résumés d'historique.
    - La détection automatique des tours termine un tour dans une pièce bruyante au lieu d'attendre la limite audio.
    - Les appareils vocaux qui diffusent leur micro en continu ignorent les tours où la détection vocale de Router n'entend aucune parole.
    - Les appareils vocaux confient le contrôle de la maison, les recherches et l'agenda à Lares et répondent dans la langue de l'utilisateur.
    - Une conversation vocale continue après une tâche déléguée, même avec les modèles qui exigent le prompt système en premier.
    - Les réponses vocales se passent du raisonnement du modèle et commencent en moins d'une seconde ; les appareils font les gestes au lieu de les décrire.
    - Les appareils vocaux répondent dans la langue qui vient d'être parlée, confirment une demande avant que l'Agent ne commence, ignorent les bruits de remplissage et annoncent les résultats sans attendre le bruit ambiant.

    [Notes de version](https://github.com/beclab/lares/releases/tag/v0.26.73)
