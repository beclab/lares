metadata:
  title: Lares
  description: Olaresの管理とウェブ調査を行うAIアシスタント

spec:
  fullDescription: |
    LaresはOlares公式のAIアシスタントです。自然言語で目標を伝えることで、アプリ、ファイル、システムを管理できます。Routerと接続済みのAIモデルを使い、Laresが手順を計画してツールを呼び出し、対話を通じてデバイス上のタスクを実行します。

    **主な機能**

    - 日常的な依頼から複数の手順が必要なタスクまで、ひとつの会話で処理できます。
    - Routerに設定されたAIモデルとツールを利用できます。
    - 読み取り専用、書き込み、フルアクセスの権限で、Laresが実行できる操作を制御できます。
    - 設定済みの検索ツールとページ読み取りツールで公開ウェブコンテンツを調査し、情報源へのリンク付きで結果を要約できます。

    **利用を始める前に**

    LaresにはOlares 1.12.7以降、Router、接続済みのAIモデルが必要です。タスクを開始する前に、モデルを選択して権限レベルを確認してください。

    ウェブ調査を行うには、Routerでツールを設定して有効にしてください。ウェブ検索には、Laresの設定でデフォルトの検索サービスを選ぶ必要もあります。ウェブページの読み取り専用ツールは、特定のURLを読むようLaresに依頼したときに呼び出されます。
  upgradeDescription: |
    設定から Home Assistant のスキルをダウンロードして有効にできます。ダウンロードはコマンドラインを入れ、スキルを書き出し、パックを有効にします。サーバーアドレスと長期トークンは同じページに保存します。

    - 思考の中だけに出たツール呼び出しは、同じターンで実行されます。
    - 新規インストール後も音声入力は起動します。
    - 自動化タスクが指示を予定どおりに実行し、テーマ別の朝のブリーフィングをワークスペースに書き出します。
    - 「デバイスツールを許可」した音声キーを使うと、Reachy Mini などのデバイスが音声会話で自分のツールを使えます。
    - Router は内部エントランスから Lares の音声に接続します。Lares ページのアドレスの先頭部分の末尾に 0 が付きます。
    - 再生の報告をしない音声デバイスが自分の返答を新しいターンとして聞かなくなり、返答が履歴の要約を待たなくなりました。
    - 自動のターン検出が、騒がしい部屋でも録音の上限まで待たずにターンを終えます。
    - マイクを常時送る音声デバイスは、Router の音声検出が発話を聞き取れなかったターンを飛ばします。
    - 音声デバイスは家電の操作、調べもの、予定を Lares に任せ、ユーザーの言語で答えます。
    - システムプロンプトを先頭に置く必要があるチャットモデルでも、委任したタスクの完了後に音声会話が続きます。
    - 音声の返答はモデルの思考を待たず 1 秒以内に始まり、デバイスは動きを言葉で説明せず実際に動きます。
    - 音声デバイスは直前に話された言語で答え、Agent が動く前に依頼を受け止め、つなぎ言葉の雑音を無視し、部屋の雑音を待たずに結果を知らせます。
    - 音声デバイスは返答の途中で割り込めるようになり、答えも短い一文になります。Lares の押して話すクライアントは変わりません。
    - 音声認識が混み合っているときは失敗せずに少し待ちます。音声デバイスは騒がしい部屋の音量を学習し、終わらない録音を続けなくなります。
    - ファンやモーターのある部屋でも、音声デバイスがその音を終わらない録音として拾わなくなりました。
    - 音声デバイスは音量ではなく音声モデルで発話を聞き分け、自分の声で自分を遮らなくなり、カメラで見たあとの返答も一文に収めます。
    - 音声デバイスは、近くで他の人が話していても話し手の言葉が終われば聞き取りを終え、タスクの受け付けも短い言葉で返します。
    - 音声デバイスの近くでの咳やノック音で、10 秒間聞き取りが続くことはなくなりました。

    [リリースノート](https://github.com/beclab/lares/releases/tag/v0.26.80)
