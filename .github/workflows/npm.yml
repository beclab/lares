# Pack @olares/lares-core and @olares/lares-mobile on PRs. Publish only from
# workflow_dispatch (after this file is on main) or a PR labeled `npm-publish`.
# Chart tags (v*) publish the Docker image, not these packages.
#
# Required repository secret:
#   NPM_OLARES_PUBLISH_TOKEN  org-scoped npm token with publish rights on @olares

name: npm

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read

concurrency:
  group: npm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Assert workspace versions and pack
        run: |
          set -euo pipefail
          core=$(node -p "require('./packages/core/package.json').version")
          mobile=$(node -p "require('./packages/mobile/package.json').version")
          if [ "$core" != "$mobile" ]; then
            echo "::error::@olares/lares-core@$core and @olares/lares-mobile@$mobile must share a version"
            exit 1
          fi
          npm pack -w @olares/lares-core
          npm pack -w @olares/lares-mobile
          echo "packed @olares/lares-core@$core @olares/lares-mobile@$mobile"

  publish:
    name: publish
    needs: check
    if: github.event_name == 'workflow_dispatch' || (github.event.action == 'labeled' && contains(github.event.pull_request.labels.*.name, 'npm-publish'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: Publish if needed, then make the packages public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_OLARES_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::NPM_OLARES_PUBLISH_TOKEN is not set on this repository"
            exit 1
          fi
          version=$(node -p "require('./packages/core/package.json').version")
          for pkg in @olares/lares-core @olares/lares-mobile; do
            if npm view "${pkg}@${version}" version >/dev/null 2>&1; then
              echo "${pkg}@${version} already on npm"
            else
              npm publish -w "${pkg}" --access public
            fi
            npm access set status=public "${pkg}"
          done
          for attempt in 1 2 3 4 5 6; do
            if curl -sfS "https://registry.npmjs.org/@olares%2flares-core/${version}" >/dev/null \
              && curl -sfS "https://registry.npmjs.org/@olares%2flares-mobile/${version}" >/dev/null; then
              echo "public registry has ${version}"
              exit 0
            fi
            sleep 10
          done
          echo "::error::packages published but public npm view still fails; check access"
          exit 1
